# 경제 이벤트 캘린더 — 하이브리드 구성
#
#  ① manual  : 이 파일에서 직접 관리 (연 8회 수준, 연초 1회 갱신이면 충분)
#              FOMC, 한국은행 금통위, 옵션만기, 휴장일 등
#  ② fred    : FRED API release 일정 자동 수집 (CPI/고용/GDP/PCE …, 미래 일정 포함)
#              → FRED_API_KEY 필요(무료). release_id → 이벤트 타입 매핑은 아래 fred_releases
#  ③ earnings: yfinance 실적발표일 (빅테크/반도체 대형주만)
#
# status: confirmed(공식 확인) | tentative(잠정/2차출처) — tentative 는 화면에 '?' 표시
# tier:   1 = 지수 변동성에 큰 영향, 2 = 중간, 3 = 참고
# 출처 확인: FOMC  https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#           금통위 https://www.bok.or.kr (통화정책 > 통화정책방향 결정회의 > 일정)

event_types:
  FOMC:    {name: "FOMC 금리결정",   tier: 1, region: US, time_local: "14:00 ET"}
  BOK:     {name: "한은 금통위",      tier: 1, region: KR, time_local: "10:00 KST"}
  CPI:     {name: "미 CPI",          tier: 1, region: US, time_local: "08:30 ET"}
  NFP:     {name: "미 고용보고서",     tier: 1, region: US, time_local: "08:30 ET"}
  GDP:     {name: "미 GDP",          tier: 2, region: US, time_local: "08:30 ET"}
  PCE:     {name: "미 PCE·개인소득",   tier: 2, region: US, time_local: "08:30 ET"}
  PPI:     {name: "미 PPI",          tier: 2, region: US, time_local: "08:30 ET"}
  RETAIL:  {name: "미 소매판매",       tier: 2, region: US, time_local: "08:30 ET"}
  OPEX:    {name: "옵션 만기",         tier: 3, region: US}
  EARN:    {name: "대형주 실적",       tier: 2, region: US}

# ② FRED release_id 매핑 — 첫 실행 시 fred/release?release_id= 로 이름 검증 후 사용
fred_releases:
  CPI:    10    # Consumer Price Index
  NFP:    50    # Employment Situation
  GDP:    53    # Gross Domestic Product
  PCE:    54    # Personal Income and Outlays
  PPI:    46    # Producer Price Index      (검증 필요)
  RETAIL: 9     # Advance Retail Sales      (검증 필요)

# ③ 실적발표 추적 대상
earnings_watch: [AAPL, MSFT, NVDA, GOOGL, AMZN, META, TSLA, AVGO, "005930.KS", "000660.KS"]

